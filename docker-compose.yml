version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: avon-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - ./mysql-init:/docker-entrypoint-initdb.d
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: avon-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  order-service:
    build: ./order-service
    container_name: avon-order-service
    ports:
      - "3001:3001"
    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: order_db
      PORT: 3001
    depends_on:
      mysql:
        condition: service_healthy

  inventory-service:
    build: ./inventory-service
    container_name: avon-inventory-service
    ports:
      - "3002:3002"
    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: inventory_db
      PORT: 3002
    depends_on:
      mysql:
        condition: service_healthy

  payment-service:
    build: ./payment-service
    container_name: avon-payment-service
    ports:
      - "3003:3003"
    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: payment_db
      PORT: 3003
    depends_on:
      mysql:
        condition: service_healthy

  shipping-service:
    build: ./shipping-service
    container_name: avon-shipping-service
    ports:
      - "3004:3004"
    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: shipping_db
      PORT: 3004
    depends_on:
      mysql:
        condition: service_healthy

  coordinator:
    build: ./coordinator
    container_name: avon-coordinator
    ports:
      - "3000:3000"
    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: coordinator_db
      PORT: 3000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ORDER_SERVICE_URL: http://order-service:3001
      INVENTORY_SERVICE_URL: http://inventory-service:3002
      PAYMENT_SERVICE_URL: http://payment-service:3003
      SHIPPING_SERVICE_URL: http://shipping-service:3004
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      order-service:
        condition: service_started
      inventory-service:
        condition: service_started
      payment-service:
        condition: service_started
      shipping-service:
        condition: service_started

  notification-service:
    build: ./notification-service
    container_name: avon-notification-service
    ports:
      - "3005:3005"
    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: root
      PORT: 3005
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: avon-frontend
    ports:
      - "4200:80"
    depends_on:
      - coordinator

volumes:
  mysql-data:
