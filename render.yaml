# Render Blueprint file for 100% FREE deployment
services:
  # Coordinator Service (Main API & Saga Orchestrator)
  - type: web
    name: order-coordinator
    env: node
    plan: free
    buildCommand: cd coordinator && npm install
    startCommand: cd coordinator && node src/index.js
    envVars:
      - key: PORT
        value: 10000
      - key: DB_HOST
        value: mysql-2092d28a-dk78834-169f.b.aivencloud.com
      - key: DB_USER
        value: avnadmin
      - key: DB_PASSWORD
        sync: false
      - key: DB_PORT
        value: "19577"
      - key: DB_NAME
        value: defaultdb
      - key: DB_SSL
        value: REQUIRED
      - key: REDIS_HOST
        value: localhost
      - key: REDIS_PORT
        value: "6379"
      - key: ORDER_SERVICE_URL
        value: https://order-microservice-sayv.onrender.com
      - key: INVENTORY_SERVICE_URL
        value: https://inventory-microservice-fk91.onrender.com
      - key: PAYMENT_SERVICE_URL
        value: https://payment-microservice-7iin.onrender.com
      - key: SHIPPING_SERVICE_URL
